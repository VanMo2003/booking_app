apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: booking-dev

resources:
  - ../../base
  - namespace.yaml

# Dòng newTag dưới đây là thứ duy nhất CI sửa. Mỗi lần đẩy lên develop, workflow
# chạy "kustomize edit set image" rồi commit lại, Argo CD thấy Git đổi và đồng bộ.
images:
  - name: ghcr.io/vanmo2003/booking_app
    newTag: latest
