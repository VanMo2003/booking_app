server:
  address: 0.0.0.0
  port: ${PORT:8080}
  servlet:
    context-path: /booking-app/api/v1

spring:
  application:
    name: booking_app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/booking_app_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:03092003}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
      enabled: true
  # Email kết quả xét duyệt chủ khách sạn. Để trống MAIL_USERNAME thì chỉ ghi log, không gửi.
  # Gmail: MAIL_USERNAME = địa chỉ Gmail, MAIL_PASSWORD = App Password 16 ký tự.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

jwt:
  signer-key: ${JWT_SIGNER_KEY:6lhXE9HRxzm7EyIVWdl0XPx9eoGdgXm8VNfpaBQ1dUDpZF6NcF8z4fDAO15JFAdF}
  valid-duration: 36000 # 10 tiếng
  refreshable-duration: 604800 # 7 ngày

file:
  upload-dir: uploads/

app:
  # Địa chỉ API mà điện thoại mở được; nút "Mở ứng dụng" trong email trỏ tới {public-url}/app-links/...
  public-url: ${APP_PUBLIC_URL:http://localhost:8080/booking-app/api/v1}
  mail:
    from: ${MAIL_FROM:}

firebase:
  # File JSON service account của Firebase (Project settings > Service accounts). Để trống thì chỉ có
  # thông báo trong app, không gửi push.
  credentials-path: ${FIREBASE_CREDENTIALS:}

vnpay:
  tmnCode : ${VNPAY_TMN_CODE:KUHZ6TQJ}
  secretKey : ${VNPAY_SECRET_KEY:K20SB7Q7577Q70YWF5I512BL3IX95TP4}
  url : ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  returnUrl : "${VNPAY_RETURN_URL:http://localhost:8080/booking-app/api/v1/payment/vn-pay-callback}"
  version : "2.1.0"
  command : "pay"
  orderType : "other"
