server:
  address: 0.0.0.0
  port: ${PORT:8080}
  servlet:
    context-path: /booking-app/api/v1

spring:
  application:
    name: booking_app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/booking_app_db}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
      enabled: true
  # Email kết quả xét duyệt chủ khách sạn. Để trống MAIL_USERNAME thì chỉ ghi log, không gửi.
  # Gmail: MAIL_USERNAME = địa chỉ Gmail, MAIL_PASSWORD = App Password 16 ký tự.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

jwt:
  signer-key: ${JWT_SIGNER_KEY:}
  valid-duration: 36000 # 10 tiếng
  refreshable-duration: 604800 # 7 ngày

file:
  upload-dir: uploads/

app:
  # Địa chỉ API mà điện thoại mở được; nút "Mở ứng dụng" trong email trỏ tới {public-url}/app-links/...
  public-url: ${APP_PUBLIC_URL:http://localhost:8080/booking-app/api/v1}
  mail:
    from: ${MAIL_FROM:}

firebase:
  # File JSON service account của Firebase (Project settings > Service accounts). Để trống thì chỉ có
  # thông báo trong app, không gửi push.
  credentials-path: ${FIREBASE_CREDENTIALS:}

ai:
  # gemini (Google AI Studio, có gói miễn phí) | anthropic (Claude, trả phí) | openai (máy chủ chuẩn OpenAI
  # khác: Groq, OpenRouter, Ollama…). Để trống thì tự chọn theo key đang có (GEMINI_API_KEY → gemini).
  provider: ${AI_PROVIDER:}
  # Không có key nào thì mọi tính năng AI tự tắt. AI_API_KEY dùng cho mọi nhà cung cấp.
  api-key: ${AI_API_KEY:}
  gemini-api-key: ${GEMINI_API_KEY:}
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
  # Để trống = địa chỉ mặc định của nhà cung cấp.
  base-url: ${AI_BASE_URL:}
  # Để trống = model mặc định: gemini-3.8-flash / gemini-3.5-flash-lite (gemini),
  # claude-sonnet-5 / claude-haiku-4-5-20251001 (anthropic). Trợ lý lễ tân cần gọi công cụ; model nhanh
  # chỉ tách bộ lọc tìm kiếm.
  assistant-model: ${AI_ASSISTANT_MODEL:}
  fast-model: ${AI_FAST_MODEL:}
  # Model thử tiếp khi model chính quá tải (503) hoặc hết lượt (429), cách nhau bởi dấu phẩy; "none" = tắt.
  # Để trống = mặc định: gemini-3.5-flash,gemini-2.5-flash (trợ lý) và gemini-2.5-flash-lite (tìm kiếm).
  assistant-fallback-models: ${AI_ASSISTANT_FALLBACK_MODELS:}
  fast-fallback-models: ${AI_FAST_FALLBACK_MODELS:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  # Cơ sở bật "tự trả lời": khách nhắn mà sau chừng này giây chưa ai của cơ sở trả lời thì trợ lý trả lời.
  auto-reply-delay-seconds: ${AI_AUTO_REPLY_DELAY_SECONDS:10}

vnpay:
  tmnCode : ${VNPAY_TMN_CODE:}
  secretKey : ${VNPAY_SECRET_KEY:}
  url : ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  returnUrl : "${VNPAY_RETURN_URL:http://localhost:8080/booking-app/api/v1/payment/vn-pay-callback}"
  version : "2.1.0"
  command : "pay"
  orderType : "other"
