services:
  booking-db:
    image: mysql:8.4
    container_name: booking-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-booking_app_db}
      MYSQL_USER: ${MYSQL_USER:-booking_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-booking_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "3306:3306"
    volumes:
      - booking-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  booking-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-app
    restart: unless-stopped
    depends_on:
      booking-db:
        condition: service_healthy
    ports:
      - "80:8080"
    environment:
      PORT: ${PORT:-8080}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://booking-db:3306/booking_app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-booking_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-booking_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:-6lhXE9HRxzm7EyIVWdl0XPx9eoGdgXm8VNfpaBQ1dUDpZF6NcF8z4fDAO15JFAdF}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-KUHZ6TQJ}
      VNPAY_SECRET_KEY: ${VNPAY_SECRET_KEY:-K20SB7Q7577Q70YWF5I512BL3IX95TP4}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost/booking-app/api/v1/payment/vn-pay-callback}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost/booking-app/api/v1}
      # Ví dụ: đặt file vào ./secrets/firebase-service-account.json rồi FIREBASE_CREDENTIALS=/app/secrets/firebase-service-account.json
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_ASSISTANT_MODEL: ${AI_ASSISTANT_MODEL:-claude-sonnet-5}
      AI_FAST_MODEL: ${AI_FAST_MODEL:-claude-haiku-4-5-20251001}
      AI_AUTO_REPLY_DELAY_SECONDS: ${AI_AUTO_REPLY_DELAY_SECONDS:-90}
    volumes:
      - ./uploads:/app/uploads
      - ./secrets:/app/secrets:ro

volumes:
  booking-db-data:
